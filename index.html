<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yiğit Automotive V6</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b1220;
    color:white;
}

header{
    padding:18px;
    text-align:center;
    font-size:26px;
    font-weight:bold;
    background:#111a2e;
}

.container{padding:20px;}

input,select{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    margin-bottom:10px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.card{
    background:#162238;
    padding:12px;
    border-radius:12px;
}

.card img{
    width:100%;
    height:140px;
    object-fit:cover;
    border-radius:10px;
}

button{
    width:100%;
    padding:8px;
    margin-top:6px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.fav{background:#f59e0b;color:black;}
.sel{background:#3b82f6;color:white;}

.panel{
    background:#1f2a44;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
}
</style>
</head>

<body>

<header>🚗 Yiğit Automotive V6</header>

<div class="container">

<input id="search" placeholder="Araba ara..." oninput="render()">

<select id="brand" onchange="render()">
<option value="all">Tüm Markalar</option>
<option value="BMW">BMW</option>
<option value="Mercedes">Mercedes</option>
<option value="Audi">Audi</option>
<option value="Toyota">Toyota</option>
<option value="Ferrari">Ferrari</option>
</select>

<div class="panel">
<h3>⚖️ Karşılaştırma Paneli</h3>
<div id="selected">Seçim yok</div>
<button onclick="compare()">Karşılaştır</button>
</div>

<div class="grid" id="list"></div>

<canvas id="chart" style="margin-top:20px;"></canvas>

</div>

<script>

let selected = JSON.parse(localStorage.getItem("selected")||"[]");

const cars=[
{name:"BMW M3",brand:"BMW",hp:510,speed:3.9,img:"https://upload.wikimedia.org/wikipedia/commons/1/18/BMW_M3_G80.jpg"},
{name:"BMW M5",brand:"BMW",hp:727,speed:3.4,img:"https://upload.wikimedia.org/wikipedia/commons/2/2d/BMW_M5_F90.jpg"},
{name:"Mercedes C63",brand:"Mercedes",hp:680,speed:3.4,img:"https://upload.wikimedia.org/wikipedia/commons/3/3e/Mercedes-AMG_C63_S.jpg"},
{name:"Audi RS5",brand:"Audi",hp:450,speed:3.7,img:"https://upload.wikimedia.org/wikipedia/commons/6/6e/Audi_RS5.jpg"},
{name:"Toyota Supra",brand:"Toyota",hp:382,speed:4.1,img:"https://upload.wikimedia.org/wikipedia/commons/9/9d/Toyota_Supra_A90.jpg"},
{name:"Ferrari F8",brand:"Ferrari",hp:720,speed:2.9,img:"https://upload.wikimedia.org/wikipedia/commons/7/7d/Ferrari_F8_Tributo.jpg"},
{name:"Lamborghini Huracan",brand:"Ferrari",hp:640,speed:2.8,img:"https://upload.wikimedia.org/wikipedia/commons/1/1f/Lamborghini_Huracan.jpg"},
{name:"Nissan GTR",brand:"Toyota",hp:600,speed:2.9,img:"https://upload.wikimedia.org/wikipedia/commons/3/3a/Nissan_GT-R.jpg"}
];

function save(){
localStorage.setItem("selected",JSON.stringify(selected));
}

function render(){

let q=document.getElementById("search").value.toLowerCase();
let brand=document.getElementById("brand").value;

let list=document.getElementById("list");
list.innerHTML="";

let data=cars.filter(c=>c.name.toLowerCase().includes(q));

if(brand!=="all") data=data.filter(c=>c.brand===brand);

// HP’ye göre otomatik güçlüden zayıfa
data.sort((a,b)=>b.hp-a.hp);

data.forEach(c=>{

list.innerHTML+=`
<div class="card">
<img src="${c.img}">
<h3>${c.name}</h3>
<p>🏷️ ${c.brand}</p>
<p>💪 ${c.hp} HP</p>
<p>⚡ 0-100: ${c.speed}s</p>

<button class="fav" onclick="fav('${c.name}')">⭐ Favori</button>
<button class="sel" onclick="selectCar('${c.name}')">⚖️ Seç</button>
</div>
`;

});

document.getElementById("selected").innerHTML =
selected.length?selected.join(" vs "):"Seçim yok";
}

function fav(name){
let c=cars.find(x=>x.name===name);
c.fav=!c.fav;
}

function selectCar(name){

if(selected.includes(name)){
selected=selected.filter(x=>x!==name);
}else{
if(selected.length<2) selected.push(name);
}

save();
render();
}

function compare(){

if(selected.length<2){
alert("2 araba seç!");
return;
}

let a=cars.find(x=>x.name===selected[0]);
let b=cars.find(x=>x.name===selected[1]);

let ctx=document.getElementById("chart");

new Chart(ctx,{
type:"bar",
data:{
labels:["HP","0-100 (ters)"],
datasets:[
{
label:a.name,
data:[a.hp,100-a.speed*20],
backgroundColor:"blue"
},
{
label:b.name,
data:[b.hp,100-b.speed*20],
backgroundColor:"red"
}
]
}
});

}

render();

</script>

</body>
</html>
