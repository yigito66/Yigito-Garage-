<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yiğit Automotive PRO</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b1220;
    color:white;
}

header{
    padding:20px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
    background:#111a2e;
}

.container{padding:20px;}

input,select{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    margin-bottom:10px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.card{
    background:#162238;
    padding:12px;
    border-radius:12px;
}

.card img{
    width:100%;
    height:140px;
    object-fit:cover;
    border-radius:10px;
}

button{
    width:100%;
    padding:8px;
    margin-top:6px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.sel{background:#3b82f6;color:white;}
.fav{background:#f59e0b;}
</style>
</head>

<body>

<header>🚗 Yiğit Automotive PRO</header>

<div class="container">

<input id="search" placeholder="Araba ara..." oninput="render()">

<select id="brand" onchange="render()">
<option value="all">Tüm Markalar</option>
<option value="BMW">BMW</option>
<option value="Mercedes">Mercedes</option>
<option value="Audi">Audi</option>
<option value="Toyota">Toyota</option>
<option value="Ferrari">Ferrari</option>
<option value="Lamborghini">Lamborghini</option>
<option value="Porsche">Porsche</option>
<option value="Nissan">Nissan</option>
</select>

<div class="grid" id="list"></div>

</div>

<script>

let selected=[];

let cars=[
{name:"BMW M3",brand:"BMW",hp:510,speed:3.9,img:"https://upload.wikimedia.org/wikipedia/commons/1/18/BMW_M3_G80.jpg"},
{name:"BMW M5",brand:"BMW",hp:727,speed:3.4,img:"https://upload.wikimedia.org/wikipedia/commons/2/2d/BMW_M5_F90.jpg"},
{name:"Mercedes C63",brand:"Mercedes",hp:680,speed:3.4,img:"https://upload.wikimedia.org/wikipedia/commons/3/3e/Mercedes-AMG_C63_S.jpg"},
{name:"Audi RS7",brand:"Audi",hp:600,speed:3.5,img:"https://upload.wikimedia.org/wikipedia/commons/4/4f/Audi_RS7.jpg"},
{name:"Toyota Supra",brand:"Toyota",hp:382,speed:4.1,img:"https://upload.wikimedia.org/wikipedia/commons/9/9d/Toyota_Supra_A90.jpg"},
{name:"Nissan GTR",brand:"Nissan",hp:600,speed:2.9,img:"https://upload.wikimedia.org/wikipedia/commons/3/3a/Nissan_GT-R.jpg"},
{name:"Porsche 911 Turbo S",brand:"Porsche",hp:650,speed:2.7,img:"https://upload.wikimedia.org/wikipedia/commons/0/0b/Porsche_911_Turbo_S.jpg"},
{name:"Ferrari F8",brand:"Ferrari",hp:720,speed:2.9,img:"https://upload.wikimedia.org/wikipedia/commons/7/7d/Ferrari_F8_Tributo.jpg"},
{name:"Lamborghini Huracan",brand:"Lamborghini",hp:640,speed:2.8,img:"https://upload.wikimedia.org/wikipedia/commons/1/1f/Lamborghini_Huracan.jpg"},
{name:"Bugatti Chiron",brand:"Bugatti",hp:1500,speed:2.4,img:"https://upload.wikimedia.org/wikipedia/commons/9/9e/Bugatti_Chiron.jpg"}
];

function render(){

let q=document.getElementById("search").value.toLowerCase();
let brand=document.getElementById("brand").value;

let list=document.getElementById("list");
list.innerHTML="";

let data=cars.filter(c=>c.name.toLowerCase().includes(q));

if(brand!=="all") data=data.filter(c=>c.brand===brand);

// HP sıralama (profesyonel görünüm)
data.sort((a,b)=>b.hp-a.hp);

data.forEach(c=>{

list.innerHTML+=`
<div class="card">
<img src="${c.img}">
<h3>${c.name}</h3>
<p>🏷️ ${c.brand}</p>
<p>💪 ${c.hp} HP</p>
<p>⚡ 0-100: ${c.speed}s</p>
</div>
`;

});

}

render();

</script>

</body>
</html>
