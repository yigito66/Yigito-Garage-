<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yiğit Automotive</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b1220;
    color:white;
}

header{
    padding:20px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
    background:#111a2e;
}

.container{padding:20px;}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

.card{
    background:#162238;
    padding:15px;
    border-radius:12px;
}

.card img{
    width:100%;
    height:150px;
    object-fit:cover;
    border-radius:10px;
}

button{
    margin-top:8px;
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.fav{background:#f59e0b;color:black;}
.cmp{background:#3b82f6;color:white;}

.compareBox{
    background:#1f2a44;
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;
}

table{
    width:100%;
    border-collapse:collapse;
}

td,th{
    border:1px solid #333;
    padding:8px;
    text-align:center;
}
</style>
</head>

<body>

<header>🚗 Yiğit Automotive</header>

<div class="container">

<input id="search" placeholder="Araba ara..." oninput="render()">

<div class="compareBox">
<h3>Karşılaştırma (2 araba seç)</h3>
<div id="selected">Henüz seçim yok</div>
<button onclick="showCompare()">Karşılaştır</button>
</div>

<div class="grid" id="list"></div>

<div id="result"></div>

</div>

<script>

let cars = [
{
name:"BMW M3",
hp:510,
speed:3.9,
img:"https://upload.wikimedia.org/wikipedia/commons/1/18/BMW_M3_G80.jpg",
fav:false
},
{
name:"Mercedes C63",
hp:680,
speed:3.4,
img:"https://upload.wikimedia.org/wikipedia/commons/3/3e/Mercedes-AMG_C63_S.jpg",
fav:false
},
{
name:"Audi RS5",
hp:450,
speed:3.7,
img:"https://upload.wikimedia.org/wikipedia/commons/6/6e/Audi_RS5.jpg",
fav:false
},
{
name:"Toyota Supra",
hp:382,
speed:4.1,
img:"https://upload.wikimedia.org/wikipedia/commons/9/9d/Toyota_Supra_A90.jpg",
fav:false
}
];

let selected = [];

function render(){

let q = document.getElementById("search").value.toLowerCase();
let list = document.getElementById("list");
list.innerHTML = "";

cars.filter(c=>c.name.toLowerCase().includes(q)).forEach(c=>{

list.innerHTML += `
<div class="card">
<img src="${c.img}">
<h3>${c.name}</h3>
<p>💪 ${c.hp} HP</p>
<p>⚡ 0-100: ${c.speed}s</p>

<button class="fav" onclick="toggleFav('${c.name}')">⭐ Favori</button>
<button class="cmp" onclick="selectCar('${c.name}')">⚖️ Seç</button>
</div>
`;

});

}

function toggleFav(name){
let car = cars.find(c=>c.name===name);
car.fav = !car.fav;
render();
}

function selectCar(name){

if(selected.includes(name)){
selected = selected.filter(c=>c!==name);
}else{
if(selected.length<2) selected.push(name);
}

document.getElementById("selected").innerHTML =
selected.length ? selected.join(" vs ") : "Henüz seçim yok";
}

function showCompare(){

if(selected.length<2){
alert("2 araba seç!");
return;
}

let a = cars.find(c=>c.name===selected[0]);
let b = cars.find(c=>c.name===selected[1]);

document.getElementById("result").innerHTML = `
<div class="compareBox">
<table>
<tr><th>Özellik</th><th>${a.name}</th><th>${b.name}</th></tr>
<tr><td>HP</td><td>${a.hp}</td><td>${b.hp}</td></tr>
<tr><td>0-100</td><td>${a.speed}s</td><td>${b.speed}s</td></tr>
</table>
</div>
`;
}

render();

</script>

</body>
</html>
