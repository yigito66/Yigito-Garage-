<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yiğit Automotive</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b1220;
    color:white;
}

header{
    padding:20px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
    background:#111a2e;
}

.container{
    padding:20px;
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

.card{
    background:#162238;
    padding:15px;
    border-radius:12px;
}

.card img{
    width:100%;
    border-radius:10px;
}

button{
    margin-top:8px;
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.fav{background:#f59e0b;color:black;}
.cmp{background:#3b82f6;color:white;}

.topbar{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.topbar button{
    flex:1;
    background:#1f2a44;
    color:white;
}
</style>
</head>

<body>

<header>🚗 Yiğit Automotive</header>

<div class="container">

<input id="search" placeholder="Araba ara..." oninput="render()">

<div class="topbar">
<button onclick="showAll()">Tümü</button>
<button onclick="showFav()">Favoriler</button>
<button onclick="showFast()">En Hızlı</button>
<button onclick="showPower()">En Güçlü</button>
</div>

<div class="grid" id="list"></div>

</div>

<script>

let cars = [
{
name:"BMW M3",
hp:510,
speed:3.9,
img:"https://cdn.motor1.com/images/mgl/0ANXo/s1/bmw-m3-2021.jpg",
fav:false
},
{
name:"Mercedes C63",
hp:680,
speed:3.4,
img:"https://cdn.motor1.com/images/mgl/8eG9v/s1/mercedes-amg-c63-s-e-performance.jpg",
fav:false
},
{
name:"Audi RS5",
hp:450,
speed:3.7,
img:"https://cdn.motor1.com/images/mgl/1ZxXq/s1/audi-rs5-sportback.jpg",
fav:false
},
{
name:"Toyota Supra",
hp:382,
speed:4.1,
img:"https://cdn.motor1.com/images/mgl/6Zx9e/s1/toyota-supra.jpg",
fav:false
},
{
name:"Nissan GTR",
hp:600,
speed:2.9,
img:"https://cdn.motor1.com/images/mgl/2Zx8e/s1/nissan-gt-r.jpg",
fav:false
}
];

let mode = "all";

function render(){

let q = document.getElementById("search").value.toLowerCase();
let list = document.getElementById("list");
list.innerHTML = "";

let filtered = cars.filter(c=>c.name.toLowerCase().includes(q));

if(mode==="fav") filtered = filtered.filter(c=>c.fav);
if(mode==="fast") filtered = filtered.sort((a,b)=>a.speed-b.speed);
if(mode==="power") filtered = filtered.sort((a,b)=>b.hp-a.hp);

filtered.forEach((c,i)=>{

list.innerHTML += `
<div class="card">
<img src="${c.img}">
<h3>${c.name}</h3>
<p>💪 ${c.hp} HP</p>
<p>⚡ 0-100: ${c.speed}s</p>

<button class="fav" onclick="toggleFav('${c.name}')">
⭐ Favori
</button>

<button class="cmp" onclick="compare('${c.name}')">
⚖️ Karşılaştır
</button>
</div>
`;

});

}

function toggleFav(name){
let car = cars.find(c=>c.name===name);
car.fav = !car.fav;
render();
}

function showAll(){ mode="all"; render(); }
function showFav(){ mode="fav"; render(); }
function showFast(){ mode="fast"; render(); }
function showPower(){ mode="power"; render(); }

function compare(name){
alert(name + " karşılaştırma seçildi (V2'de tablo yapacağız)");
}

render();

</script>

</body>
</html>
